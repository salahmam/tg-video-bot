<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بانر ترويجي - Hemo Max</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', sans-serif; }
    
    .gradient-bg {
      background: linear-gradient(135deg, #0d9488 0%, #065f46 50%, #064e3b 100%);
    }
    
    .product-image-frame {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.4);
    }
    
    .feature-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .feature-card:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-5px);
    }
    
    .pulse-btn {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      50% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
    }
    
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      animation: sparkle 2s infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
 </head>
 <body class="h-full overflow-auto">
  <div id="banner-container" class="gradient-bg min-h-full w-full relative overflow-hidden">
   
   <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute top-10 right-10 w-72 h-72 bg-emerald-400 rounded-full opacity-10 blur-3xl"></div>
    <div class="absolute bottom-10 left-10 w-96 h-96 bg-teal-300 rounded-full opacity-10 blur-3xl"></div>
    <div class="sparkle" style="top: 20%; right: 15%; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 40%; right: 25%; animation-delay: 0.5s;"></div>
    <div class="sparkle" style="top: 60%; left: 20%; animation-delay: 1s;"></div>
   </div>

   <div class="relative z-10 flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-12 p-6 lg:p-12 min-h-full">
    
    <div class="flex-1 text-center lg:text-right max-w-xl">
     <div class="inline-flex items-center gap-2 bg-amber-500 text-white px-4 py-2 rounded-full text-sm font-bold mb-6 shadow-lg">
      <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
      <span>منتج مضمون 100%</span>
     </div>

     <div class="inline-block bg-gradient-to-r from-amber-400 to-amber-500 text-white px-6 py-3 rounded-full text-2xl font-black mb-4 shadow-lg">
      💊 Hemo Max
     </div>

     <h1 class="text-4xl lg:text-5xl xl:text-6xl font-black text-white mb-4 leading-tight drop-shadow-lg">تخلص من آلام البواسير</h1>
     <p class="text-xl lg:text-2xl text-emerald-100 mb-8 font-medium">علاج طبيعي وفعال بدون آثار جانبية</p>

     <div class="inline-block bg-yellow-400 text-yellow-900 px-8 py-4 rounded-2xl text-3xl font-black mb-8 shadow-xl">
      💰 15,000 دينار
     </div>

     <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="feature-card rounded-2xl p-4 text-center">
       <div class="w-14 h-14 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
       </div>
       <p class="text-white font-bold text-lg">نتائج سريعة</p>
      </div>
      <div class="feature-card rounded-2xl p-4 text-center">
       <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
       </div>
       <p class="text-white font-bold text-lg">مكونات طبيعية</p>
      </div>
      <div class="feature-card rounded-2xl p-4 text-center">
       <div class="w-14 h-14 bg-gradient-to-br from-teal-400 to-teal-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
       </div>
       <p class="text-white font-bold text-lg">آمن ومجرب</p>
      </div>
     </div>

     <button class="pulse-btn bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white text-xl lg:text-2xl font-bold py-4 px-10 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 mb-6 w-full lg:w-auto">
      🛒 اطلب الآن عبر الواتساب
     </button>

     <div class="flex items-center justify-center lg:justify-start gap-3 text-white">
      <div class="bg-white/20 backdrop-blur-sm rounded-full p-3">
       <svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" /></svg>
      </div>
      <span class="text-2xl font-black tracking-widest">07710011031</span>
     </div>
    </div>

    <div class="flex-1 flex items-center justify-center">
     <div class="product-image-frame rounded-3xl w-80 h-80 lg:w-[450px] lg:h-[450px] float-animation relative overflow-hidden flex items-center justify-center bg-white/5">
      <img src="Image-name.png.jpg" 
           class="w-full h-full object-contain p-4" 
           alt="Hemo Max Product"
           onerror="this.style.display='none'; alert('تنبيه: لم يتم العثور على الصورة. تأكد من رفع ملف Image-name.png.jpg بجانب هذا الملف في GitHub')">
     </div>
    </div>

   </div>

   <div class="absolute bottom-0 left-0 w-full overflow-hidden leading-none">
    <svg class="relative block w-full h-16" viewbox="0 0 1200 120" preserveaspectratio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C57.71,118.92,124.38,95.18,184.51,77.36,247.58,58.64,313.22,49.89,321.39,56.44Z" fill="rgba(255,255,255,0.1)" /></svg>
   </div>
  </div>
 </body>
</html>
